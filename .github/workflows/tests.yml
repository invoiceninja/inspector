name: tests

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4', '8.5']
        testbench: ['^10.0', '^11.0']
        exclude:
          - php: '8.2'
            testbench: '^11.0'

    name: PHP ${{ matrix.php }} - Testbench ${{ matrix.testbench }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none

      - name: Install dependencies
        run: composer update --prefer-dist --no-interaction --with "orchestra/testbench:${{ matrix.testbench }}"

      - name: Run tests
        run: composer test
